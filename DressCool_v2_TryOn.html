            </div>
          </div>
        </div>
        {/* Dots */}
        <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:7,marginTop:12}}>

      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   OUTFIT SCREEN — 假人預覽 + AI 虛擬試穿（2D 疊圖）
   2D 疊圖流程：姿勢偵測 → 人像分割 → 服裝疊合生成
═══════════════════════════════════════════════════ */
const TRYON_PIPELINE=[
  {Icon:ScanIco,label:'姿勢偵測',sub:'定位肩、腰、手臂關鍵點'},
  {Icon:LayersIco,label:'人像分割',sub:'分離人物與背景 / 原有衣物'},
  {Icon:SparkleIco,label:'服裝疊合生成',sub:'將衣物貼合到你的體型與姿勢'},
];

function OutfitScreen(){
  const[selTop,setSelTop]=useState(TOPS[1]);
  const[selBot,setSelBot]=useState(BOTTOMS[0]);
  const[selShoe,setSelShoe]=useState(SHOES[0]);
  const[tab,setTab]=useState('tops');
  const[saved,setSaved]=useState(false);
  const[mode,setMode]=useState('mannequin'); // 'mannequin' | 'photo'
  const[photo,setPhoto]=useState(null);
  const[processing,setProcessing]=useState(false);
  const[pStep,setPStep]=useState(-1);
  const[compare,setCompare]=useState(false);
  const fileRef=useRef(null);
  const tabs=[{id:'tops',label:'上衣',items:TOPS},{id:'bottoms',label:'下裝',items:BOTTOMS},{id:'shoes',label:'鞋子',items:SHOES}];

  const handleFile=(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      setPhoto(ev.target.result);
      setCompare(false);
      setProcessing(true);
      setPStep(-1);
      TRYON_PIPELINE.forEach((_,i)=>setTimeout(()=>setPStep(i),500+i*600));
      setTimeout(()=>setProcessing(false),500+TRYON_PIPELINE.length*600+300);
    };
    reader.readAsDataURL(file);
  };

  return(
    <div style={{flex:1,background:C.cream,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'16px 20px 8px',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <p style={{fontSize:18,fontWeight:700,color:C.espresso,margin:0}}>穿搭配對</p>
        <div style={{display:'flex',gap:10}}><HeartIco size={20} color={C.camel}/><SearchIco size={20} color={C.espresso}/></div>
      </div>

      {/* 假人預覽 / AI 試穿 模式切換 */}
      <div style={{padding:'0 16px 10px',flexShrink:0}}>
        <div style={{display:'flex',background:C.sand,borderRadius:14,padding:3,gap:3}}>
          {[{id:'mannequin',label:'假人預覽'},{id:'photo',label:'AI 試穿・2D 疊圖'}].map(m=>(
            <button key={m.id} onClick={()=>setMode(m.id)} style={{flex:1,padding:'8px 0',border:'none',borderRadius:11,fontSize:11.5,fontWeight:600,cursor:'pointer',background:mode===m.id?C.espresso:'transparent',color:mode===m.id?'white':C.taupe,transition:'background 0.15s'}}>{m.label}</button>
          ))}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'0 16px'}}>

        {/* ── 假人預覽模式 ── */}
        {mode==='mannequin'&&(
          <div style={{background:'#EAE0D4',borderRadius:24,display:'flex',flexDirection:'column',alignItems:'center',padding:'20px 16px',marginBottom:14,position:'relative'}}>
            <div style={{position:'absolute',width:180,height:180,borderRadius:'50%',border:'1px solid rgba(200,168,130,0.15)',top:'50%',left:'50%',transform:'translate(-50%,-50%)'}}/>
            <MannequinFull tc={selTop.color} bc={selBot.color} sc={selShoe.color} w={148} h={311}/>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'center',marginTop:10}}>
              {[selTop,selBot,selShoe].map((item,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:4,background:C.ivory,borderRadius:20,padding:'4px 10px',border:`1px solid ${C.blush}`}}>
                  <div style={{width:10,height:10,borderRadius:2,background:item.color,border:'1px solid rgba(0,0,0,0.08)',flexShrink:0}}/>
                  <span style={{fontSize:10,color:C.espresso}}>{item.name}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── AI 試穿・2D 疊圖模式 ── */}
        {mode==='photo'&&(
          <div style={{marginBottom:14}}>
            {!photo&&(
              <div onClick={()=>fileRef.current&&fileRef.current.click()} style={{background:'#EAE0D4',borderRadius:24,minHeight:300,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,cursor:'pointer',border:`1.5px dashed ${C.camel}`}}>
                <div style={{width:52,height:52,borderRadius:'50%',background:C.ivory,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <CameraIco size={24} color={C.bark}/>
                </div>
                <p style={{fontSize:13,fontWeight:700,color:C.espresso,margin:0}}>上傳一張全身照</p>
                <p style={{fontSize:10.5,color:C.taupe,margin:0,textAlign:'center',padding:'0 30px',lineHeight:1.6}}>建議正面站姿、光線均勻、背景單純，疊圖效果會更準確</p>
                <span style={{marginTop:2,padding:'9px 26px',background:C.espresso,color:'white',borderRadius:22,fontSize:12,fontWeight:600}}>選擇照片</span>
              </div>
            )}
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/>

            {photo&&(
              <div style={{background:'#EAE0D4',borderRadius:24,padding:14}}>
                <div style={{position:'relative',width:'100%',aspectRatio:'3/4',borderRadius:18,overflow:'hidden',border:`1px solid ${C.blush}`}}>
                  <img src={photo} style={{width:'100%',height:'100%',objectFit:'cover',filter:processing?'saturate(0.85)':'none',display:'block'}}/>

                  {processing&&(
                    <div style={{position:'absolute',left:0,right:0,height:2,background:`linear-gradient(90deg,transparent,${C.camel},transparent)`,boxShadow:`0 0 10px ${C.camel}`,animation:'dcscan 1.6s ease-in-out infinite'}}/>
                  )}

                  {!processing&&!compare&&(
                    <div style={{position:'absolute',left:'20%',right:'20%',top:'18%',height:'36%',borderRadius:'20% 20% 10% 10%',background:selTop.color,opacity:0.6,mixBlendMode:'multiply',clipPath:'polygon(15% 0%,85% 0%,100% 16%,88% 100%,12% 100%,0% 16%)'}}/>
                  )}

                  {!processing&&(
                    <div style={{position:'absolute',top:8,left:8,background:'rgba(58,46,42,0.6)',borderRadius:8,padding:'3px 8px',fontSize:8.5,color:'white'}}>模擬效果 · Demo</div>
                  )}
                  {!processing&&(
                    <div onClick={()=>setCompare(c=>!c)} style={{position:'absolute',bottom:8,right:8,background:'rgba(58,46,42,0.6)',borderRadius:14,padding:'5px 11px',fontSize:9.5,color:'white',cursor:'pointer'}}>
                      {compare?'看試穿結果':'看原始照片'}
                    </div>
                  )}
                </div>

                {processing?(
                  <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:9}}>
                    {TRYON_PIPELINE.map((p,i)=>{
                      const done=i<pStep,active=i===pStep;
                      return(
                        <div key={p.label} style={{display:'flex',alignItems:'center',gap:9}}>
                          <div style={{width:24,height:24,borderRadius:12,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:done?C.espresso:active?C.blush:C.sand,border:active?`1.5px solid ${C.espresso}`:'none'}}>
                            <p.Icon size={12} color={done?'white':active?C.bark:C.taupe} sw={2}/>
                          </div>
                          <div>
                            <p style={{fontSize:11.5,fontWeight:(done||active)?700:400,color:(done||active)?C.espresso:C.taupe,margin:0}}>{p.label}</p>
                            <p style={{fontSize:9.5,color:C.taupe,margin:0}}>{p.sub}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ):(
                  <div style={{marginTop:10,display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                    <div>
                      <p style={{fontSize:12,fontWeight:700,color:C.espresso,margin:0}}>{selTop.name}</p>
                      <p style={{fontSize:10,color:C.taupe,margin:'2px 0 0'}}>已疊合到你的照片上</p>
                    </div>
                    <button onClick={()=>fileRef.current&&fileRef.current.click()} style={{padding:'6px 14px',background:C.ivory,border:`1px solid ${C.blush}`,borderRadius:18,fontSize:10.5,color:C.bark,cursor:'pointer',flexShrink:0}}>重新上傳</button>
                  </div>
                )}
              </div>
            )}

            {photo&&!processing&&(
              <div style={{marginTop:10,borderRadius:14,background:C.ivory,border:`1px solid ${C.blush}`,padding:'10px 12px'}}>
                <p style={{fontSize:9.5,color:C.taupe,margin:0,lineHeight:1.65}}>
                  ℹ️ 目前為 UI 原型的模擬疊圖效果，正式版將串接 2D 虛擬試穿模型，依據真實姿勢與體型生成更精確的上身結果。
                </p>
              </div>
            )}
          </div>
        )}

        {/* 衣物分類與選擇 — 兩種模式共用 */}
        <div style={{display:'flex',gap:6,marginBottom:10}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'8px 0',background:tab===t.id?C.espresso:C.sand,color:tab===t.id?'white':C.taupe,border:'none',borderRadius:10,fontSize:12,cursor:'pointer'}}>{t.label}</button>
          ))}
        </div>
        <div style={{display:'flex',gap:4,overflowX:'auto',paddingBottom:8}}>
          {tabs.find(t=>t.id===tab).items.map(item=>(
            <ClothCard key={item.id} item={item}
              selected={tab==='tops'?selTop.id===item.id:tab==='bottoms'?selBot.id===item.id:selShoe.id===item.id}
              onSelect={i=>{if(tab==='tops')setSelTop(i);else if(tab==='bottoms')setSelBot(i);else setSelShoe(i);setSaved(false);}}
            />
          ))}
        </div>
        <button onClick={()=>setSaved(true)} style={{width:'100%',padding:'14px 0',marginTop:8,marginBottom:16,background:saved?'#8A9A85':C.espresso,color:'white',border:'none',borderRadius:16,fontSize:14,cursor:'pointer'}}>
          {saved?'✓ 已儲存此搭配':'儲存搭配'}
        </button>
      </div>
    </div>
  );
}

          {[{l:'身高',v:'162cm'},{l:'體重',v:'50kg'},{l:'尺寸',v:'S'},{l:'風格',v:'日系休閒'}].map((i,idx)=>(
            <div key={idx} style={{background:C.sand,borderRadius:20,padding:'4px 10px',display:'flex',gap:3}}>
              <span style={{fontSize:10,color:C.taupe}}>{i.l}：</span>
              <span style={{fontSize:10,color:C.espresso,fontWeight:700}}>{i.v}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{padding:'12px 16px'}}>
        <p style={{fontSize:11,fontWeight:600,color:C.taupe,margin:'0 0 8px',letterSpacing:'0.5px'}}>功能設定</p>
        {menu.map((item,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:`0.5px solid ${C.blush}`,cursor:'pointer'}}>
            <div style={{width:38,height:38,borderRadius:11,background:C.sand,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <item.Icon size={16} color={C.bark}/>
            </div>
            <div style={{flex:1}}>
              <p style={{fontSize:13,color:C.espresso,margin:0,fontWeight:500}}>{item.label}</p>
              {item.desc&&<p style={{fontSize:10,color:C.taupe,margin:'2px 0 0'}}>{item.desc}</p>}
            </div>
            <ChevronRightIco size={16} color={C.taupe}/>
          </div>
        ))}
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',cursor:'pointer',marginTop:4}}>
          <div style={{width:38,height:38,borderRadius:11,background:'#FFF0EE',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <LogOutIco size={16} color="#C0392B"/>
          </div>
          <p style={{fontSize:13,color:'#C0392B',margin:0}}>登出帳號</p>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   BOTTOM NAV
═══════════════════════════════════════════════════ */
function BottomNav({active,onChange}){
  const tabs=[{id:'home',Icon:HomeIco},{id:'outfit',Icon:LayersIco},{id:'closet',Icon:ArchiveIco},{id:'calendar',Icon:CalendarIco},{id:'profile',Icon:UserIco}];
  return(
    <div style={{display:'flex',background:C.ivory,borderTop:`0.5px solid ${C.blush}`,padding:'12px 0 24px',flexShrink:0}}>
      {tabs.map(({id,Icon})=>(
        <button key={id} onClick={()=>onChange(id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,background:'none',border:'none',cursor:'pointer',padding:'2px 0'}}>
          <Icon size={24} color={active===id?C.bark:C.taupe} sw={active===id?2:1.5}/>
          {active===id?<div style={{width:5,height:5,borderRadius:'50%',background:C.camel}}/>:<div style={{width:5,height:5}}/>}
        </button>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════ */
function App(){
  const[screen,setScreen]=useState('home');
  const map={home:<HomeScreen goTo={setScreen}/>,outfit:<OutfitScreen/>,closet:<ClosetScreen/>,calendar:<CalendarScreen/>,profile:<ProfileScreen/>};
  return(
    <div style={{display:'flex',justifyContent:'center',alignItems:'flex-start',minHeight:'100vh',background:'#D9D1C7',padding:'24px 16px'}}>
      <div style={{width:375,background:C.cream,borderRadius:48,overflow:'hidden',display:'flex',flexDirection:'column',boxShadow:'0 36px 80px rgba(58,46,42,0.26), 0 0 0 7px #C4BAB0, 0 0 0 9px #B6ADA5',minHeight:812}}>
        {/* Status bar */}
        <div style={{height:48,background:screen==='profile'?C.sand:C.cream,display:'flex',justifyContent:'space-between',alignItems:'flex-end',padding:'0 28px 8px',flexShrink:0}}>
          <span style={{fontSize:14,fontWeight:700,color:C.espresso}}>9:41</span>
          <div style={{width:110,height:26,background:'#1A1A1A',borderRadius:20}}/>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <div style={{display:'flex',gap:1.5,alignItems:'flex-end'}}>
              {[8,11,14,17].map((h,i)=><div key={i} style={{width:3,height:h,background:i<3?C.espresso:'#CCC',borderRadius:1}}/>)}
            </div>
            <span style={{fontSize:11,color:C.espresso,marginLeft:2}}>5G</span>
            <div style={{width:22,height:11,border:`1.5px solid ${C.espresso}`,borderRadius:3,display:'flex',alignItems:'center',padding:'1.5px',marginLeft:2}}>
              <div style={{flex:1,height:'100%',background:C.espresso,borderRadius:1.5}}/>
              <div style={{width:2,height:6,background:C.espresso,marginLeft:1,borderRadius:1}}/>
            </div>
          </div>
        </div>
        <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>{map[screen]}</div>
        <BottomNav active={screen} onChange={setScreen}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
